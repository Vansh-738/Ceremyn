name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (mypy)
        run: mypy
      - name: Architecture contracts (import-linter)
        run: lint-imports
      - name: Unit tests
        run: pytest tests/unit -q --cov --cov-report=xml --cov-fail-under=85

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ceremyn
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: ceremyn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ceremyn"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://ceremyn:change-me@localhost:5432/ceremyn
        run: pytest tests/integration -q -m integration
