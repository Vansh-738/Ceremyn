[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaquant"
version = "0.1.0"
description = "Institutional-grade AI-assisted options trading research platform for Indian markets"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez — naive datetimes are bugs in a trading system
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["alphaquant", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are the idiomatic default-argument pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001", "DTZ005"]
# The dashboard shell is a single inlined HTML/CSS/JS document, not Python prose:
# line-length and ambiguous-unicode rules do not apply to that markup blob.
"src/alphaquant/dashboard/shell.py" = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["alphaquant"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["kiteconnect.*", "apscheduler.*", "scipy.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires running Postgres/Redis (docker compose)",
]

[tool.coverage.run]
source = ["src/alphaquant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "alphaquant"

# Architectural invariant: the domain layer is pure — it may not import any
# other alphaquant package (infrastructure, services, or interfaces).
[[tool.importlinter.contracts]]
name = "Domain layer is independent"
type = "independence"
modules = ["alphaquant.domain"]

[[tool.importlinter.contracts]]
name = "Domain cannot import infrastructure"
type = "forbidden"
source_modules = ["alphaquant.domain"]
forbidden_modules = [
    "alphaquant.api",
    "alphaquant.broker",
    "alphaquant.data",
    "alphaquant.execution",
]

# The dashboard is read-only observability: it may read value/metric snapshots but must
# never reach the order-placement / broker / live-connection code, so it can never place
# an order or bypass the OMS. Enforced structurally here.
[[tool.importlinter.contracts]]
name = "Dashboard cannot place orders or bypass the OMS"
type = "forbidden"
source_modules = ["alphaquant.dashboard"]
forbidden_modules = [
    "alphaquant.oms.engine",
    "alphaquant.oms.executor",
    "alphaquant.oms.router",
    "alphaquant.oms.broker",
    "alphaquant.live.engine",
    "alphaquant.live.kite",
    "alphaquant.paper.broker",
    "alphaquant.paper.engine",
    "alphaquant.execution",
    "alphaquant.broker",
    "alphaquant.data.providers.kite",
]

[[tool.importlinter.contracts]]
name = "Strategies cannot import execution"
type = "forbidden"
source_modules = ["alphaquant.strategies"]
forbidden_modules = ["alphaquant.execution"]

[[tool.importlinter.contracts]]
name = "Strategies cannot import broker"
type = "forbidden"
source_modules = ["alphaquant.strategies"]
forbidden_modules = ["alphaquant.broker"]

[[tool.importlinter.contracts]]
name = "LLM cannot import execution"
type = "forbidden"
source_modules = ["alphaquant.llm"]
forbidden_modules = ["alphaquant.execution"]

[[tool.importlinter.contracts]]
name = "LLM cannot import risk"
type = "forbidden"
source_modules = ["alphaquant.llm"]
forbidden_modules = ["alphaquant.risk"]

[[tool.importlinter.contracts]]
name = "Live cannot import broker"
type = "forbidden"
source_modules = ["alphaquant.live"]
forbidden_modules = ["alphaquant.broker"]

[[tool.importlinter.contracts]]
name = "Live cannot import execution"
type = "forbidden"
source_modules = ["alphaquant.live"]
forbidden_modules = ["alphaquant.execution"]

[[tool.importlinter.contracts]]
name = "OMS cannot import strategies"
type = "forbidden"
source_modules = ["alphaquant.oms"]
forbidden_modules = ["alphaquant.strategies"]

[[tool.importlinter.contracts]]
name = "OMS cannot import paper"
type = "forbidden"
source_modules = ["alphaquant.oms"]
forbidden_modules = ["alphaquant.paper"]

[[tool.importlinter.contracts]]
name = "Risk cannot import broker"
type = "forbidden"
source_modules = ["alphaquant.risk"]
forbidden_modules = ["alphaquant.broker"]

[[tool.importlinter.contracts]]
name = "Risk cannot import execution"
type = "forbidden"
source_modules = ["alphaquant.risk"]
forbidden_modules = ["alphaquant.execution"]

[[tool.importlinter.contracts]]
name = "Risk cannot import strategies"
type = "forbidden"
source_modules = ["alphaquant.risk"]
forbidden_modules = ["alphaquant.strategies"]

[[tool.importlinter.contracts]]
name = "Risk cannot import llm"
type = "forbidden"
source_modules = ["alphaquant.risk"]
forbidden_modules = ["alphaquant.llm"]
