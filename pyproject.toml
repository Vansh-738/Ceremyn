[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ceremyn"
version = "0.1.0"
description = "Risk-first AI-assisted market intelligence platform for Indian equities and options"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ceremyn.dashboard" = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez — naive datetimes are bugs in a trading system
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["ceremyn", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are the idiomatic default-argument pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001", "DTZ005"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ceremyn"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["kiteconnect.*", "apscheduler.*", "scipy.*", "plotly.*", "talib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires running Postgres/Redis (docker compose)",
]

[tool.coverage.run]
source = ["src/ceremyn"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "ceremyn"

[[tool.importlinter.contracts]]
name = "Domain cannot import any other Ceremyn layer"
type = "forbidden"
source_modules = ["ceremyn.domain"]
forbidden_modules = [
    "ceremyn.api",
    "ceremyn.backtest",
    "ceremyn.broker",
    "ceremyn.config",
    "ceremyn.core",
    "ceremyn.dashboard",
    "ceremyn.data",
    "ceremyn.execution",
    "ceremyn.features",
    "ceremyn.fundamentals",
    "ceremyn.live",
    "ceremyn.llm",
    "ceremyn.oms",
    "ceremyn.paper",
    "ceremyn.patterns",
    "ceremyn.research",
    "ceremyn.risk",
    "ceremyn.runtime",
    "ceremyn.strategies",
]

# The dashboard is read-only observability: it may read value/metric snapshots but must
# never reach the order-placement / broker / live-connection code, so it can never place
# an order or bypass the OMS. Enforced structurally here.
[[tool.importlinter.contracts]]
name = "Dashboard cannot place orders or bypass the OMS"
type = "forbidden"
source_modules = ["ceremyn.dashboard"]
forbidden_modules = [
    "ceremyn.oms.engine",
    "ceremyn.oms.executor",
    "ceremyn.oms.router",
    "ceremyn.oms.broker",
    "ceremyn.live.engine",
    "ceremyn.live.kite",
    "ceremyn.paper.broker",
    "ceremyn.paper.engine",
    "ceremyn.execution",
    "ceremyn.broker",
    "ceremyn.data.providers.kite",
]

[[tool.importlinter.contracts]]
name = "Strategies cannot import execution"
type = "forbidden"
source_modules = ["ceremyn.strategies"]
forbidden_modules = ["ceremyn.execution"]

[[tool.importlinter.contracts]]
name = "Strategies cannot import broker"
type = "forbidden"
source_modules = ["ceremyn.strategies"]
forbidden_modules = ["ceremyn.broker"]

[[tool.importlinter.contracts]]
name = "LLM cannot import execution"
type = "forbidden"
source_modules = ["ceremyn.llm"]
forbidden_modules = ["ceremyn.execution"]

[[tool.importlinter.contracts]]
name = "LLM cannot import risk"
type = "forbidden"
source_modules = ["ceremyn.llm"]
forbidden_modules = ["ceremyn.risk"]

[[tool.importlinter.contracts]]
name = "Live cannot import broker"
type = "forbidden"
source_modules = ["ceremyn.live"]
forbidden_modules = ["ceremyn.broker"]

[[tool.importlinter.contracts]]
name = "Live cannot import execution"
type = "forbidden"
source_modules = ["ceremyn.live"]
forbidden_modules = ["ceremyn.execution"]

[[tool.importlinter.contracts]]
name = "OMS cannot import strategies"
type = "forbidden"
source_modules = ["ceremyn.oms"]
forbidden_modules = ["ceremyn.strategies"]

[[tool.importlinter.contracts]]
name = "OMS cannot import paper"
type = "forbidden"
source_modules = ["ceremyn.oms"]
forbidden_modules = ["ceremyn.paper"]

# OMS receives BrokerAdapter instances via DI (concrete types constructed at the
# composition root) and codes only against the protocol it defines itself in
# oms/broker.py. This makes "do not leak broker-specific logic into OMS" a CI check.
[[tool.importlinter.contracts]]
name = "OMS cannot import broker"
type = "forbidden"
source_modules = ["ceremyn.oms"]
forbidden_modules = ["ceremyn.broker"]

[[tool.importlinter.contracts]]
name = "OMS cannot import execution"
type = "forbidden"
source_modules = ["ceremyn.oms"]
forbidden_modules = ["ceremyn.execution"]

[[tool.importlinter.contracts]]
name = "Risk cannot import broker"
type = "forbidden"
source_modules = ["ceremyn.risk"]
forbidden_modules = ["ceremyn.broker"]

[[tool.importlinter.contracts]]
name = "Risk cannot import execution"
type = "forbidden"
source_modules = ["ceremyn.risk"]
forbidden_modules = ["ceremyn.execution"]

[[tool.importlinter.contracts]]
name = "Risk cannot import strategies"
type = "forbidden"
source_modules = ["ceremyn.risk"]
forbidden_modules = ["ceremyn.strategies"]

[[tool.importlinter.contracts]]
name = "Risk cannot import llm"
type = "forbidden"
source_modules = ["ceremyn.risk"]
forbidden_modules = ["ceremyn.llm"]

# `patterns` is read-only market-intelligence discovery (see ROADMAP_V2.md): it may
# detect and study patterns but must never reach execution/risk/OMS/broker, the same
# structural guarantee already enforced for `llm`. A `Pattern` has no path to become
# an order except by a human or a versioned `Strategy` acting on it independently.
[[tool.importlinter.contracts]]
name = "Patterns cannot import execution"
type = "forbidden"
source_modules = ["ceremyn.patterns"]
forbidden_modules = ["ceremyn.execution"]

[[tool.importlinter.contracts]]
name = "Patterns cannot import risk"
type = "forbidden"
source_modules = ["ceremyn.patterns"]
forbidden_modules = ["ceremyn.risk"]

[[tool.importlinter.contracts]]
name = "Patterns cannot import OMS"
type = "forbidden"
source_modules = ["ceremyn.patterns"]
forbidden_modules = ["ceremyn.oms"]

[[tool.importlinter.contracts]]
name = "Patterns cannot import broker"
type = "forbidden"
source_modules = ["ceremyn.patterns"]
forbidden_modules = ["ceremyn.broker"]

[[tool.importlinter.contracts]]
name = "Fundamentals cannot reach trading services"
type = "forbidden"
source_modules = ["ceremyn.fundamentals"]
forbidden_modules = ["ceremyn.execution", "ceremyn.risk", "ceremyn.oms", "ceremyn.broker"]
